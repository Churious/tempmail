<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Self-hosted Temp Mail</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen"><main class="max-w-3xl mx-auto p-6"><h1 class="text-3xl font-bold mb-2">Temp Mail</h1><p class="text-slate-400 mb-6">개인 서버에서 동작하는 휘발성 메일함</p><section class="bg-slate-900 rounded-2xl p-5 mb-5"><div class="text-sm text-slate-400">내 메일 주소</div><div id="address" class="text-xl font-mono mt-1">발급 중...</div><div class="flex gap-2 mt-4"><button id="copy" class="bg-blue-600 px-4 py-2 rounded-lg">복사</button><button id="preserve" class="bg-emerald-600 px-4 py-2 rounded-lg">메일함 보존</button></div></section><section class="bg-slate-900 rounded-2xl p-5"><h2 class="font-semibold mb-3">받은 메일</h2><div id="messages" class="space-y-2 text-slate-300">아직 메일이 없습니다.</div></section></main><script>
let token='',address='';const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};return fetch(path,opt).then(r=>r.json())}async function start(){let x=await api('/api/v1/mailboxes',{method:'POST',body:'{}'});token=x.token;address=x.address;$('address').textContent=address;load();let ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws/'+encodeURIComponent(address));ws.onmessage=load}async function load(){let xs=await api('/api/v1/mailboxes/'+encodeURIComponent(address)+'/messages');$('messages').innerHTML=xs.length?xs.map(x=>`<button class="block w-full text-left bg-slate-800 p-3 rounded-lg" onclick="openMsg('${x.id}')"><b>${x.subject||'(제목 없음)'}</b><span class="text-sm text-slate-400 ml-2">${x.sender_address}</span></button>`).join(''):'아직 메일이 없습니다.'}async function openMsg(id){let x=await api('/api/v1/messages/'+id);alert((x.subject||'')+'\n\n'+(x.body_text||''))}$('copy').onclick=()=>navigator.clipboard.writeText(address);$('preserve').onclick=async()=>{let p=prompt('복원에 사용할 비밀번호(8자 이상)');if(p)alert((await api('/api/v1/mailboxes/preserve',{method:'POST',body:JSON.stringify({password:p})})).ok?'보존되었습니다.':'실패했습니다.')} ;start();
</script></body></html>
